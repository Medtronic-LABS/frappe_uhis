name: Frappe UHIS CI and GHCR Push

# Builds the all-in-one image (docker/allinone/Dockerfile), pushes it to GHCR
# and updates the image tag in deploy-scripts.
#
# Image built:
#   docker/allinone/Dockerfile -> frappe_uhis
#
# Environments: dev, training, brac-prod (GitHub Settings -> Environments).
#   - Push to develop builds "dev".
#   - Push to training builds "training".
#   - Push to main builds "brac-prod".
#   - Run manually (workflow_dispatch) to pick any of the three.
#
# Per-environment variables (set on each GitHub Environment):
#   Required : DEPLOY_BRANCH   (deploy-scripts branch to update)
#              MANIFEST_DIR    (folder in deploy-scripts that has the yaml files,
#                               e.g. kubernetes-manifest/leapwell-dev)
# Shared (repo level is fine): variable GHCR_ORG
#                              secrets GHCR_USERNAME, GHCR_TOKEN,
#                                      CI_BOT_USER, CI_BOT_TOKEN

on:
  push:
    branches:
      - develop
      - training
      - main
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to build and update
        type: choice
        options:
          - dev
          - training
          - brac-prod
        default: dev
      frappe_theme_ref:
        description: frappe_theme git ref to build against
        required: false
        default: claude/mcp-server
      spice_next_core_ref:
        description: spice_next_core git ref to build against
        required: false
        default: main
      shukhee_integration_ref:
        description: shukhee_integration git ref to build against
        required: false
        default: main
      leapwell_telemetry_ref:
        description: leapwell_telemetry git ref to build against
        required: false
        default: main

permissions:
  contents: read
  packages: write

concurrency:
  group: frappe-uhis-${{ inputs.environment || (github.ref_name == 'develop' && 'dev') || (github.ref_name == 'main' && 'brac-prod') || github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment || (github.ref_name == 'develop' && 'dev') || (github.ref_name == 'main' && 'brac-prod') || github.ref_name }}
    env:
      REGISTRY: ghcr.io
      IMAGE_NAME: frappe_uhis
      GHCR_IMAGE: ghcr.io/${{ vars.GHCR_ORG }}/frappe_uhis
      ENV_NAME: ${{ inputs.environment || (github.ref_name == 'develop' && 'dev') || (github.ref_name == 'main' && 'brac-prod') || github.ref_name }}
      DEPLOY_REPO: bitbucket.org/MDTLabs/deploy-scripts.git
      DEPLOY_BRANCH: ${{ vars.DEPLOY_BRANCH }}
      MANIFEST_DIR: ${{ vars.MANIFEST_DIR }}

    steps:
      - name: Validate pipeline settings
        env:
          CI_BOT_USER: ${{ secrets.CI_BOT_USER }}
          CI_BOT_TOKEN: ${{ secrets.CI_BOT_TOKEN }}
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          GHCR_ORG: ${{ vars.GHCR_ORG }}
        run: |
          missing=""
          for name in GHCR_ORG GHCR_USERNAME GHCR_TOKEN CI_BOT_USER CI_BOT_TOKEN \
                      DEPLOY_BRANCH MANIFEST_DIR; do
            if [ -z "${!name:-}" ]; then
              missing="${missing} ${name}"
            fi
          done
          if [ -n "${missing}" ]; then
            echo "::error::Missing for environment '${ENV_NAME}':${missing}"
            exit 1
          fi
          echo "Environment: ${ENV_NAME}"
          echo "Deploy branch: ${DEPLOY_BRANCH}"
          echo "Manifest dir: ${MANIFEST_DIR}"

      # Parent apps are checked out first so the Dockerfile can COPY them in.
      # uhis is checked out last.
      - name: Checkout frappe_theme
        uses: actions/checkout@v5
        with:
          repository: Suvaidyam/frappe_theme
          ref: ${{ inputs.frappe_theme_ref || 'claude/mcp-server' }}
          path: apps/frappe_theme

      - name: Checkout spice_next_core
        uses: actions/checkout@v5
        with:
          repository: Medtronic-LABS/frappe_spice_next_core
          ref: ${{ inputs.spice_next_core_ref || 'main' }}
          path: apps/spice_next_core

      - name: Checkout shukhee_integration
        uses: actions/checkout@v5
        with:
          repository: Medtronic-LABS/leapwell_shukhee_integration
          ref: ${{ inputs.shukhee_integration_ref || 'main' }}
          path: apps/shukhee_integration

      - name: Checkout leapwell_telemetry
        uses: actions/checkout@v5
        with:
          repository: Medtronic-LABS/frappe_leapwell_telemetry
          ref: ${{ inputs.leapwell_telemetry_ref || 'main' }}
          path: apps/leapwell_telemetry

      - name: Checkout uhis
        uses: actions/checkout@v5
        with:
          path: apps/uhis

      - name: Set image tag
        run: echo "IMAGE_TAG=${ENV_NAME}-${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.GHCR_USERNAME }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Build and push container image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/uhis/docker/allinone/Dockerfile
          build-args: |
            FRAPPE_BRANCH=v16.51.0
          push: true
          tags: ${{ env.GHCR_IMAGE }}:${{ env.IMAGE_TAG }}
          cache-from: type=gha,scope=${{ env.IMAGE_NAME }}-${{ env.ENV_NAME }}
          cache-to: type=gha,mode=max,scope=${{ env.IMAGE_NAME }}-${{ env.ENV_NAME }}
          provenance: false

      - name: Update image tag in deploy-scripts
        env:
          CI_BOT_USER: ${{ secrets.CI_BOT_USER }}
          CI_BOT_TOKEN: ${{ secrets.CI_BOT_TOKEN }}
        run: |
          set -euo pipefail
          REMOTE="https://${CI_BOT_USER}:${CI_BOT_TOKEN}@${DEPLOY_REPO}"
          NEW_IMAGE="${GHCR_IMAGE}:${IMAGE_TAG}"

          git clone --depth 1 -b "${DEPLOY_BRANCH}" "${REMOTE}" deploy-scripts
          cd deploy-scripts

          # Update the image line in one specific yaml file.
          #   $1 = yaml file name, $2 = image name
          # sed only edits the line that has "image: .../<image name>:<tag>",
          # so other containers in the same file stay untouched.
          update_image() {
            file="${MANIFEST_DIR}/$1"
            image="$2"

            if [ ! -f "${file}" ]; then
              echo "::error::Missing deploy manifest: ${file}"
              exit 1
            fi

            sed -i -E "s|^([[:space:]]*image:[[:space:]]*)ghcr\.io/[^[:space:]]*/${image}:[^[:space:]]*|\1${NEW_IMAGE}|" "${file}"

            if ! grep -qE "^[[:space:]]*image:[[:space:]]*${NEW_IMAGE}\$" "${file}"; then
              echo "::error::No '${image}' image line found in ${file}"
              exit 1
            fi
            git add "${file}"
            echo "Updated ${file}"
            grep -n "image: ghcr.io" "${file}"
          }

          update_image frappe-uhis.yaml frappe_uhis

          git config user.name "ci-bot"
          git config user.email "ci-bot@bitbucket.org"

          if git diff --cached --quiet; then
            echo "Image tag already up to date. Nothing to commit."
            exit 0
          fi

          git commit -m "ci(${ENV_NAME}): update ${IMAGE_NAME} image to ${IMAGE_TAG}"
          for attempt in 1 2 3; do
            if git push origin "${DEPLOY_BRANCH}"; then
              echo "Updated ${MANIFEST_DIR}/frappe-uhis.yaml to ${NEW_IMAGE}"
              exit 0
            fi
            git pull --rebase origin "${DEPLOY_BRANCH}"
          done
          echo "::error::Could not push the image tag update"
          exit 1
