# Builds the all-in-one production image (docker/allinone/Dockerfile — bench with
# every app this deployment ships, plus MariaDB + Redis, all in one container; see
# docker/allinone/ and frappe-uhis-next/docs/deployment/production.md for the full
# architecture), pushes it to GHCR, and — only on main — redeploys the production
# server over SSH.
#
# CI/CD control lives here, in uhis, rather than in spice_next_core: spice_next_core
# is a shared core package reused across deployments, while uhis is the
# client-specific app (required_apps = spice_next_core, shukhee_integration,
# leapwell_telemetry — see uhis/hooks.py) that actually decides what goes live for
# this deployment. spice_next_core's own docker-publish.yml has had its push
# trigger disabled to avoid two workflows racing to deploy the same host.
#
# IMPORTANT one-time follow-up (outside this repo): the deploy host's
# docker-compose.yml must be updated to pull ${REGISTRY}/${IMAGE_NAME} (this image)
# for the `frappe-uhis` service instead of the old
# ghcr.io/medtronic-labs/frappe_spice_next_core image.
name: Build, publish, and deploy

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      frappe_theme_ref:
        description: "frappe_theme git ref to build against"
        required: false
        default: development
      spice_next_core_ref:
        description: "spice_next_core git ref to build against"
        required: false
        default: main
      shukhee_integration_ref:
        description: "shukhee_integration git ref to build against"
        required: false
        default: main
      leapwell_telemetry_ref:
        description: "leapwell_telemetry git ref to build against"
        required: false
        default: main

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  # GHCR requires a lowercase repository path — github.repository preserves the
  # GitHub org's actual casing (Medtronic-LABS/...), so this is spelled out
  # explicitly rather than derived, to avoid a push-time rejection.
  IMAGE_NAME: medtronic-labs/frappe_uhis

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      # Parent apps (uhis's required_apps chain, per uhis/hooks.py: frappe_theme ->
      # spice_next_core -> shukhee_integration / leapwell_telemetry) are checked out
      # BEFORE uhis itself, so the Dockerfile can COPY every dependency in with the
      # exact commit fixed at workflow time — no `bench get-app` re-clone at build
      # time, no ref-drift between "what CI tested" and "what got baked into the
      # image". All four are public repos (frappe_theme always was; the three
      # Medtronic-LABS siblings were made public since) — actions/checkout needs no
      # token for any of them. uhis itself stays private; only its own checkout
      # (below) runs under the workflow's own default GITHUB_TOKEN.
      - name: Checkout frappe_theme
        uses: actions/checkout@v4
        with:
          repository: Suvaidyam/frappe_theme
          ref: ${{ inputs.frappe_theme_ref || 'development' }}
          path: apps/frappe_theme

      - name: Checkout spice_next_core
        uses: actions/checkout@v4
        with:
          repository: Medtronic-LABS/frappe_spice_next_core
          ref: ${{ inputs.spice_next_core_ref || 'main' }}
          path: apps/spice_next_core

      - name: Checkout shukhee_integration
        uses: actions/checkout@v4
        with:
          repository: Medtronic-LABS/leapwell_shukhee_integration
          ref: ${{ inputs.shukhee_integration_ref || 'main' }}
          path: apps/shukhee_integration

      - name: Checkout leapwell_telemetry
        uses: actions/checkout@v4
        with:
          repository: Medtronic-LABS/frappe_leapwell_telemetry
          ref: ${{ inputs.leapwell_telemetry_ref || 'main' }}
          path: apps/leapwell_telemetry

      # uhis itself is checked out last -- it's the dependent, not a dependency
      # (required_apps = spice_next_core, shukhee_integration, leapwell_telemetry).
      - name: Checkout uhis
        uses: actions/checkout@v4
        with:
          path: apps/uhis

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short
            type=semver,pattern={{version}}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/uhis/docker/allinone/Dockerfile
          build-args: |
            FRAPPE_BRANCH=version-16
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    # Only redeploy from a direct push to main — a version-tag push builds and
    # publishes an immutable image but does not also trigger a redeploy of what a
    # preceding push to main already put live.
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Deploy to production via SSH
        uses: appleboy/ssh-action@v1
        env:
          # Forwarded into the remote script's environment via `envs:` below --
          # NOT interpolated into the script string itself, so a secret value
          # never appears as literal text in the script GitHub sends over SSH.
          SITE_NAME: ${{ secrets.SITE_NAME }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_SCHEMA: ${{ secrets.DB_SCHEMA }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT }}
          envs: SITE_NAME,ADMIN_PASSWORD,DB_HOST,DB_PORT,DB_NAME,DB_USER,DB_PASSWORD,DB_SCHEMA
          script: |
            set -eu
            DEPLOY_PATH="/home/ubuntu/frappe_uhis_"
            REPO_PATH="${DEPLOY_PATH}/repo"

            # The git checkout lives in a subdirectory, not DEPLOY_PATH itself --
            # DEPLOY_PATH may already hold unrelated content from the old
            # hand-set-up (pre-CI-managed) deploy, and git clone refuses to clone
            # into a non-empty directory. Cloning into REPO_PATH instead means
            # nothing already at DEPLOY_PATH is ever touched, moved, or deleted.
            mkdir -p "${DEPLOY_PATH}"
            if [ -d "${REPO_PATH}/.git" ]; then
              cd "${REPO_PATH}"
              git fetch origin main
              git reset --hard origin/main
            else
              git clone --branch main https://github.com/Medtronic-LABS/frappe_uhis.git "${REPO_PATH}"
              cd "${REPO_PATH}"
            fi

            # .env is gitignored and rewritten fresh from secrets on every deploy --
            # it is CI-owned config, not a file anyone hand-edits on the host.
            cat > .env <<ENV
            SITE_NAME=${SITE_NAME}
            ADMIN_PASSWORD=${ADMIN_PASSWORD}
            DB_HOST=${DB_HOST}
            DB_PORT=${DB_PORT}
            DB_NAME=${DB_NAME}
            DB_USER=${DB_USER}
            DB_PASSWORD=${DB_PASSWORD}
            DB_SCHEMA=${DB_SCHEMA}
            ENV
            chmod 600 .env

            docker compose -f docker-compose.yml pull frappe-uhis
            docker compose -f docker-compose.yml up -d frappe-uhis
            echo "Waiting for application to start..."
            sleep 30

            # Hits the frappe-uhis container's published port directly on the
            # deploy host (docker-compose.yml maps 8000:8000) -- no reverse proxy
            # in front of it. Fail the workflow loudly if the new container isn't
            # healthy. No automated rollback (out of scope for this pass).
            #
            # 60 retries @ 10s (10 min) -- a *first-ever* deploy runs bench new-site
            # + installs 5 apps + bench migrate from scratch inside site-setup.sh
            # before this can ever succeed, which routinely takes several minutes;
            # the previous 20×5s (100s) budget was tuned for a warm redeploy only
            # and failed the workflow on every cold start regardless of whether
            # anything was actually wrong.
            for i in $(seq 1 60); do
              if curl -fsS -H "Host: ${SITE_NAME}" "http://localhost:8000/api/method/ping" >/dev/null; then
                echo "post-deploy healthcheck passed"
                exit 0
              fi
              sleep 10
            done
            echo "post-deploy healthcheck failed" >&2
            docker ps
            exit 1
